name: CI
# Runs on every pull request and on main. Least-privilege token; third-party actions pinned to commit SHAs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: ws/kiro-qa-testing }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kirotick/kiro-web
          path: ws/kiro-web
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kirotick/kiro-pos
          path: ws/kiro-pos
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kirotick/kiro-mobile
          path: ws/kiro-mobile
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kirotick/kiro-backend
          path: ws/kiro-backend
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kirotick/kiro-payments
          path: ws/kiro-payments
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kirotick/kiro-database
          path: ws/kiro-database
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Install
        working-directory: ws/kiro-qa-testing
        run: npm ci && npx playwright install --with-deps chromium
      - name: Quick QA (unit of every repo, security, Chromium browser suite)
        working-directory: ws/kiro-qa-testing
        run: node scripts/run-all.mjs --quick
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: qa-report
          retention-days: 14
          path: |
            ws/kiro-qa-testing/reports
            ws/kiro-qa-testing/artifacts
